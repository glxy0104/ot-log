<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>근무시간 기록</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6f8b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="근무기록">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
:root{--bg:#f5f7f9;--card:#fff;--fg:#1b2430;--mut:#66727f;--acc:#1f6f8b;--acc2:#e8f1f5;--warn:#c0392b;--bd:#dde3e8}
@media(prefers-color-scheme:dark){:root{--bg:#121619;--card:#1c2228;--fg:#e8edf1;--mut:#9aa5b0;--acc:#5fb3cf;--acc2:#1f3540;--bd:#2d3741}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,"Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--fg);padding-bottom:calc(70px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 8px;font-weight:700;font-size:18px}
main{padding:0 16px}
h3{margin:14px 0 8px;font-size:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 14px;cursor:pointer;display:inline-block;margin:0}
button.p,.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button.warn{color:var(--warn)}
.big{font-size:20px;padding:18px 0;width:100%;font-weight:700;line-height:1.3}
.big small{font-weight:400;font-size:13px;opacity:.85}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:20px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);min-height:44px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
label.btn,label.btnlike{display:inline-flex;margin:0;color:var(--fg);font-size:inherit;align-items:center;justify-content:center}
.btnlike{width:72px;height:72px;border:1px dashed var(--bd);border-radius:8px;color:var(--mut)!important;font-size:13px!important}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;padding:14px 0;color:var(--mut);background:none;font-size:15px}
nav button.on{color:var(--acc);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sb{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.warn{color:var(--warn)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.kv:last-of-type{border-bottom:0}
.badge{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--acc2);white-space:nowrap}
.badge.red{background:var(--warn);color:#fff}
.badge.org{background:#e67e22;color:#fff}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;background:var(--bd)}
.item{padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}
a{color:var(--acc)}
dialog{border:0;border-radius:12px;padding:16px;max-width:92vw;background:var(--card);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.6)}
#print{display:none}
@media print{body>*{display:none!important}#print{display:block!important}body{padding:0;background:#fff;color:#000;font-size:11px}#print table{border-collapse:collapse;width:100%;margin-bottom:14px}#print th,#print td{border:1px solid #999;padding:3px 5px;text-align:left;vertical-align:top}}
</style>
</head>
<body>
<header>근무시간 기록</header>
<main id="view"></main>
<nav>
<button data-v="today" onclick="go('today')">기록</button>
<button data-v="list" onclick="go('list')">목록</button>
<button data-v="month" onclick="go('month')">월별</button>
<button data-v="settings" onclick="go('settings')">설정</button>
</nav>
<dialog id="dlg"></dialog>
<div id="print"></div>
<script>
// ---------- 데이터 ----------
const KEY='otlog.v1';
const DEF={settings:{wage:0,payday:25,payMonth:'same',shifts:{D:['07:00','15:00'],E:['15:00','23:00'],N:['23:00','07:00']},reasons:['인수인계','인증평가 준비','교육·회의','업무 마무리','기타']},records:[],pay:{}};
const FIELD={date:'날짜',shift:'근무조',schedStart:'정규시작',schedEnd:'정규종료',actStart:'실제출근',actEnd:'실제퇴근',reason:'사유',basis:'지시근거',note:'메모',files:'첨부'};
const SHIFT={D:'데이(D)',E:'이브닝(E)',N:'나이트(N)',OFF:'휴일(OFF)'};
const DOW='일월화수목금토';
let S=load(), view='today', formId=null;

function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j)return{settings:{...DEF.settings,...j.settings},records:j.records||[],pay:j.pay||{}};}catch(e){}return JSON.parse(JSON.stringify(DEF));}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}

// 첨부 파일은 IndexedDB (localStorage는 5MB 한계)
const idb=new Promise((res,rej)=>{const q=indexedDB.open('otlog',1);q.onupgradeneeded=()=>q.result.createObjectStore('files',{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
async function fx(mode,fn){const db=await idb;return new Promise((res,rej)=>{const t=db.transaction('files',mode);const r=fn(t.objectStore('files'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});}
const files={put:f=>fx('readwrite',s=>s.put(f)),get:id=>fx('readonly',s=>s.get(id)),del:id=>fx('readwrite',s=>s.delete(id)),all:()=>fx('readonly',s=>s.getAll()),clear:()=>fx('readwrite',s=>s.clear())};

// ---------- 유틸 ----------
const pad=n=>String(n).padStart(2,'0');
const todayStr=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const toMin=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m;};
const fmtMin=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return (h?h+'시간':'')+(r||!h?(h?' ':'')+r+'분':'');};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rec=id=>S.records.find(r=>r.id===id);
const parts=d=>d.split('-').map(Number);
const dow=d=>{const [y,m,dd]=parts(d);return DOW[new Date(y,m-1,dd).getDay()];};
const fmtDate=d=>{const [,m,dd]=parts(d);return `${m}/${dd}(${dow(d)})`;};
const fmtISO=iso=>{const d=new Date(iso);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;};
const fmtTS=iso=>fmtISO(iso).slice(5);
const wonF=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const ymLabel=ym=>ym.replace('-','년 ')+'월';

// ---------- 계산 ----------
// 초과 = 정규 시작 전(조기) + 정규 종료 후(연장). 휴일(OFF)은 전체가 초과. 야간 = 초과 중 22~06시 겹침.
function calc(r){
  const z={early:0,late:0,ot:0,night:0,ok:false};
  let a0=toMin(r.actStart),a1=toMin(r.actEnd);if(a0==null||a1==null)return z;
  const segs=[];
  if(r.shift==='OFF'){if(a1<=a0)a1+=1440;segs.push([a0,a1]);z.late=a1-a0;}
  else{
    let s0=toMin(r.schedStart),s1=toMin(r.schedEnd);if(s0==null||s1==null)return z;
    if(s1<=s0)s1+=1440;
    if(s0-a0>720)a0+=1440;else if(a0-s0>720)a0-=1440;
    if(a1<=a0)a1+=1440;
    if(a0<s0){const e=Math.min(s0,a1);segs.push([a0,e]);z.early=e-a0;}
    if(a1>s1){const b=Math.max(s1,a0);segs.push([b,a1]);z.late=a1-b;}
  }
  z.ot=z.early+z.late;z.ok=true;
  for(const [x,y] of segs)for(const [p,q] of [[-120,360],[1320,1800],[2760,3240]])z.night+=Math.max(0,Math.min(y,q)-Math.max(x,p));
  return z;
}
const won=(z,w)=>Math.round(w*(z.ot/60*1.5+z.night/60*0.5));
function payDate(ym){let [y,m]=parts(ym);if(S.settings.payMonth==='next'){m++;if(m>12){m=1;y++;}}const last=new Date(y,m,0).getDate();return new Date(y,m-1,Math.min(S.settings.payday,last));}
function expiry(ym){const d=payDate(ym);d.setFullYear(d.getFullYear()+3);return d;}
function monthly(){const g={};for(const r of S.records){const ym=r.date.slice(0,7);const o=g[ym]=g[ym]||{ym,recs:[],ot:0,night:0,live:0,rest:0};const z=calc(r);o.recs.push(r);o.ot+=z.ot;o.night+=z.night;r.source==='restored'?o.rest++:o.live++;}return Object.values(g).sort((a,b)=>b.ym.localeCompare(a.ym));}
function monthEst(m){const w=S.settings.wage;const est=w?Math.round(w*(m.ot/60*1.5+m.night/60*0.5)):0;const paid=+(S.pay[m.ym]||0);return{est,paid,unpaid:est-paid};}
const rows=ym=>[...S.records].filter(r=>!ym||r.date.startsWith(ym)).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt));

// ---------- 기록 조작 (덮어쓰기 금지: 바꾸면 이력에 남김) ----------
function logChange(r,field,from,to){if((from||'')===(to||''))return;(r.history=r.history||[]).push({at:new Date().toISOString(),field,from:from||'',to:to||''});}
function newRecord(date,shift,source){const sh=S.settings.shifts[shift]||['',''];const r={id:uid(),date,shift,schedStart:shift==='OFF'?'':sh[0],schedEnd:shift==='OFF'?'':sh[1],actStart:'',actEnd:'',reason:'',basis:'',note:'',files:[],source,createdAt:new Date().toISOString(),history:[]};S.records.push(r);save();return r;}
function clockIn(shift){const r=newRecord(todayStr(),shift,'live');r.actStart=nowHM();r.stampStart=new Date().toISOString();save();render();}
function clockOut(id){const r=rec(id);r.actEnd=nowHM();r.stampEnd=new Date().toISOString();save();render();}
function setF(id,f,v){
  const r=rec(id);if((r[f]||'')===(v||''))return;
  const draft=!r.actStart&&!r.actEnd; // 시각을 아직 안 넣은 기록은 작성 중 → 수정 이력 안 남김
  if(r[f]&&!draft)logChange(r,f,r[f],v);
  r[f]=v;
  if(f==='shift'){const sh=S.settings.shifts[v]||['',''];const ns=v==='OFF'?'':sh[0],ne=v==='OFF'?'':sh[1];if(!draft){if(r.schedStart)logChange(r,'schedStart',r.schedStart,ns);if(r.schedEnd)logChange(r,'schedEnd',r.schedEnd,ne);}r.schedStart=ns;r.schedEnd=ne;}
  save();patch(r);
}
function setReason(id,i){const r=rec(id);const v=S.settings.reasons[i];setF(id,'reason',r.reason===v?'':v);render();}
function openNew(date,source){if(!date){const d=new Date();d.setDate(d.getDate()-1);date=todayStr(d);}const r=newRecord(date,'D',source);openForm(r.id);}
function openForm(id){formId=id;view='form';render();}
async function delRec(id){const r=rec(id);if(!confirm(`${fmtDate(r.date)} ${SHIFT[r.shift]} 기록을 삭제할까요? 되돌릴 수 없습니다.`))return;for(const f of r.files||[])await files.del(f.id);S.records=S.records.filter(x=>x.id!==id);save();view='list';render();}
function setPay(ym,v){if(v==='')delete S.pay[ym];else S.pay[ym]=+v;save();render();}
function setS(k,v){S.settings[k]=v;save();}
function setShift(k,i,v){S.settings.shifts[k][i]=v;save();}

// ---------- 첨부 ----------
const readDU=f=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(f);});
async function shrink(f){const url=URL.createObjectURL(f);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return c.toDataURL('image/jpeg',.85);}
async function addFiles(id,fl){
  const r=rec(id);
  for(const f of fl){
    let data,type=f.type||'application/octet-stream';
    try{if(type.startsWith('image/')){data=await shrink(f);type='image/jpeg';}else{if(f.size>5e6){alert(f.name+': 5MB를 넘어 첨부할 수 없습니다');continue;}data=await readDU(f);}}
    catch(e){alert(f.name+': 읽을 수 없는 파일');continue;}
    const m={id:uid(),name:f.name,type,size:data.length};
    await files.put({...m,recordId:id,data});(r.files=r.files||[]).push(m);logChange(r,'files','','＋'+f.name);
  }
  save();render();
}
async function viewFile(fid){const f=await files.get(fid);if(!f)return alert('파일을 찾을 수 없습니다');if(f.type.startsWith('image/')){dlg.innerHTML=`<img src="${f.data}" style="max-width:100%;max-height:70vh;display:block"><div class=row style="margin-top:10px"><button onclick="dlg.close()">닫기</button><button onclick="shareFile('${fid}')">공유</button><button class=warn onclick="delFile('${fid}')">삭제</button></div>`;dlg.showModal();}else shareFile(fid);}
async function shareFile(fid){const f=await files.get(fid);const b=await(await fetch(f.data)).blob();shareOrDownload(new Blob([b],{type:f.type}),f.name);}
async function delFile(fid){const r=S.records.find(r=>(r.files||[]).some(f=>f.id===fid));const m=r.files.find(f=>f.id===fid);if(!confirm(`첨부 "${m.name}"을(를) 삭제할까요?`))return;await files.del(fid);r.files=r.files.filter(f=>f.id!==fid);logChange(r,'files','','－'+m.name);save();dlg.close();render();}
function loadThumbs(){document.querySelectorAll('img[data-fid]').forEach(async i=>{const f=await files.get(i.dataset.fid);if(f)i.src=f.data;});}

// ---------- 내보내기 ----------
async function shareOrDownload(blob,name){
  const f=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return;}catch(e){if(e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);
}
const hist=r=>(r.history||[]).map(x=>`${fmtISO(x.at)} ${FIELD[x.field]||x.field}: ${x.from}→${x.to}`).join(' | ');
function exportCSV(ym){
  const w=S.settings.wage;
  const H=['날짜','요일','근무조','정규시작','정규종료','실제출근','실제퇴근','조기출근(분)','연장퇴근(분)','초과합계(분)','야간겹침(분)','추정액(원)','사유','지시근거','메모','첨부파일','기록구분','출근기록시각','퇴근기록시각','생성시각','수정이력'];
  const L=[H,...rows(ym).map(r=>{const z=calc(r);return[r.date,dow(r.date),r.shift,r.schedStart,r.schedEnd,r.actStart,r.actEnd,z.ok?z.early:'',z.ok?z.late:'',z.ok?z.ot:'',z.ok?z.night:'',z.ok&&w?won(z,w):'',r.reason,r.basis,r.note,(r.files||[]).map(f=>f.name).join('; '),r.source==='restored'?'사후복원':'당일',r.stampStart?fmtISO(r.stampStart):'',r.stampEnd?fmtISO(r.stampEnd):'',fmtISO(r.createdAt),hist(r)];})];
  const csv='﻿'+L.map(l=>l.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\r\n');
  shareOrDownload(new Blob([csv],{type:'text/csv'}),`근무시간기록_${ym||'전체'}_${todayStr()}.csv`);
}
function reportHTML(ym){
  const w=S.settings.wage;const ms=monthly().filter(m=>!ym||m.ym===ym).reverse();
  const td=a=>'<tr>'+a.map(x=>`<td>${esc(x)}</td>`).join('')+'</tr>',th=a=>'<tr>'+a.map(x=>`<th>${x}</th>`).join('')+'</tr>';
  let h=`<h2>근무시간 기록 보고서 ${ym?ymLabel(ym):'(전체)'}</h2><p>작성 ${fmtISO(new Date().toISOString())} · 통상시급 ${w?wonF(w):'미입력'} · 급여일 매월 ${S.settings.payday}일(${S.settings.payMonth==='next'?'익월':'당월'} 지급)<br>금액은 추정치(초과 ×1.5, 야간 겹침 +0.5)이며 최종 계산은 노무사 확인이 필요합니다. '사후복원' 기록은 당일 기록과 구분됩니다.</p>`;
  h+='<table>'+th(['월','건수(당일/복원)','초과합계','야간겹침','법정추정','급여명세 시간외','미지급추정','급여일','시효만료'])+ms.map(m=>{const e=monthEst(m);return td([ymLabel(m.ym),`${m.recs.length} (${m.live}/${m.rest})`,fmtMin(m.ot),fmtMin(m.night),w?wonF(e.est):'-',S.pay[m.ym]!=null?wonF(e.paid):'-',w?(e.unpaid>0?wonF(e.unpaid):'없음'):'-',payDate(m.ym).toLocaleDateString('ko-KR'),expiry(m.ym).toLocaleDateString('ko-KR')]);}).join('')+'</table>';
  h+='<table>'+th(['날짜','조','정규','실제','조기','연장','합계','야간','추정액','사유','지시근거·메모','첨부','구분','기록시각','수정이력'])+rows(ym).map(r=>{const z=calc(r);return td([`${r.date}(${dow(r.date)})`,r.shift,r.shift==='OFF'?'-':`${r.schedStart}–${r.schedEnd}`,`${r.actStart||'?'}–${r.actEnd||'?'}`,z.ok?z.early:'',z.ok?z.late:'',z.ok?z.ot:'',z.ok?z.night:'',z.ok&&w?wonF(won(z,w)):'',r.reason,[r.basis,r.note].filter(Boolean).join(' / '),(r.files||[]).map(f=>f.name).join(', '),r.source==='restored'?'사후복원':'당일',`생성 ${fmtISO(r.createdAt)}`+(r.stampStart?`\n출근탭 ${fmtISO(r.stampStart)}`:'')+(r.stampEnd?`\n퇴근탭 ${fmtISO(r.stampEnd)}`:''),hist(r)]);}).join('')+'</table>';
  return h;
}
function printReport(ym){document.getElementById('print').innerHTML=reportHTML(ym);window.print();}
function shareReport(ym){const html=`<!doctype html><html lang="ko"><meta charset="utf-8"><title>근무시간 기록</title><style>body{font-family:sans-serif;font-size:12px;padding:16px}table{border-collapse:collapse;width:100%;margin-bottom:16px}th,td{border:1px solid #999;padding:3px 5px;text-align:left;vertical-align:top;white-space:pre-line}</style>${reportHTML(ym)}`;shareOrDownload(new Blob([html],{type:'text/html'}),`근무시간보고서_${ym||'전체'}_${todayStr()}.html`);}
async function exportJSON(){const fs=await files.all();const j={app:'otlog',version:1,exportedAt:new Date().toISOString(),settings:S.settings,records:S.records,pay:S.pay,files:fs};shareOrDownload(new Blob([JSON.stringify(j)],{type:'application/json'}),`근무기록_백업_${todayStr()}.json`);}
async function importJSON(file){
  if(!file)return;let j;try{j=JSON.parse(await file.text());}catch(e){return alert('백업 파일이 아닙니다');}
  if(j.app!=='otlog'||!Array.isArray(j.records))return alert('백업 파일이 아닙니다');
  if(!confirm(`백업(${j.exportedAt?fmtISO(j.exportedAt):'?'}, 기록 ${j.records.length}건)으로 지금 데이터를 모두 교체할까요?`))return;
  S={settings:{...DEF.settings,...j.settings},records:j.records,pay:j.pay||{}};save();
  await files.clear();for(const f of j.files||[])await files.put(f);
  alert('복원했습니다');render();
}

// ---------- 화면 ----------
function go(v){view=v;render();}
function render(){
  document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===view||(view==='form'&&b.dataset.v==='list')));
  document.getElementById('view').innerHTML={today,list,month,settings,form}[view]();
  loadThumbs();window.scrollTo(0,0);
}
const standalone=()=>matchMedia('(display-mode: standalone)').matches||navigator.standalone;
const banner=()=>standalone()?'':`<div class="card mut">📲 홈 화면에 추가해서 쓰세요. iPhone: Safari 공유 버튼 → "홈 화면에 추가". Android: Chrome 메뉴 → "홈 화면에 추가". 그래야 앱처럼 열리고 저장된 기록이 지워지지 않습니다.</div>`;
function summary(r){
  const z=calc(r),w=S.settings.wage;
  let h=r.shift!=='OFF'?`<div class=mut>정규 ${r.schedStart||'?'}–${r.schedEnd||'?'}</div>`:'';
  if(!z.ok)return h+`<div class=mut>출근·퇴근 시각을 모두 넣으면 초과 시간이 계산됩니다.</div>`;
  return h+`<div class="row sb"><span>초과 <b>${fmtMin(z.ot)}</b> <span class=mut>(조기 ${z.early}분 + 연장 ${z.late}분 · 야간 겹침 ${z.night}분)</span></span><b>${w?wonF(won(z,w))+' 추정':'<span class=mut>시급 미설정</span>'}</b></div>`;
}
function patch(r){
  const s=document.getElementById('sum-'+r.id);if(s)s.innerHTML=summary(r);
  const a=document.getElementById('sched-'+r.id);if(a){a.style.display=r.shift==='OFF'?'none':'';a.querySelector('[data-f=schedStart]').value=r.schedStart;a.querySelector('[data-f=schedEnd]').value=r.schedEnd;}
  const t=document.getElementById('ttl-'+r.id);if(t)t.textContent=`${fmtDate(r.date)} ${SHIFT[r.shift]}`;
}
function editor(r,full){
  const id=r.id;
  let h=`<div class=card><div class="row sb"><b id="ttl-${id}">${fmtDate(r.date)} ${SHIFT[r.shift]}</b>${r.source==='restored'?'<span class="badge org">사후 복원</span>':'<span class=badge>당일 기록</span>'}</div>`;
  if(full){
    h+=`<div class=grid2><div><label>날짜</label><input type=date value="${r.date}" onchange="setF('${id}','date',this.value)"></div><div><label>근무조</label><select onchange="setF('${id}','shift',this.value)">${Object.keys(SHIFT).map(s=>`<option value=${s} ${s===r.shift?'selected':''}>${SHIFT[s]}</option>`).join('')}</select></div></div>`;
    h+=`<div class=grid2 id="sched-${id}" style="${r.shift==='OFF'?'display:none':''}"><div><label>정규 시작</label><input type=time data-f=schedStart value="${r.schedStart}" onchange="setF('${id}','schedStart',this.value)"></div><div><label>정규 종료</label><input type=time data-f=schedEnd value="${r.schedEnd}" onchange="setF('${id}','schedEnd',this.value)"></div></div>`;
  }
  h+=`<div class=grid2><div><label>실제 출근${r.stampStart?` <span class=mut>(${fmtTS(r.stampStart)} 탭)</span>`:''}</label><input type=time value="${r.actStart}" onchange="setF('${id}','actStart',this.value)"></div>`;
  h+=`<div><label>실제 퇴근${r.stampEnd?` <span class=mut>(${fmtTS(r.stampEnd)} 탭)</span>`:''}</label>${r.actEnd||full?`<input type=time value="${r.actEnd}" onchange="setF('${id}','actEnd',this.value)">`:`<button class=p style="width:100%;min-height:44px" onclick="clockOut('${id}')">퇴근 지금 (${nowHM()})</button>`}</div></div>`;
  h+=`<div id="sum-${id}" style="margin-top:10px">${summary(r)}</div>`;
  h+=`<label>사유</label><div class=chips>${S.settings.reasons.map((x,i)=>`<button class="chip ${r.reason===x?'on':''}" onclick="setReason('${id}',${i})">${esc(x)}</button>`).join('')}</div>`;
  h+=`<label>지시 근거 <span class=mut>(누가·언제·어떻게 지시했는지, 안 하면 어떤 불이익인지)</span></label><textarea rows=2 placeholder="예: 10/20 병동 단톡 수간호사 공지 '인계 30분 전 도착'" onchange="setF('${id}','basis',this.value)">${esc(r.basis)}</textarea>`;
  h+=`<label>근거 첨부 <span class=mut>(공지 캡처·단톡·출석부·녹음)</span></label><div class=thumbs>${(r.files||[]).map(f=>f.type.startsWith('image/')?`<img data-fid="${f.id}" alt="${esc(f.name)}" onclick="viewFile('${f.id}')">`:`<button onclick="viewFile('${f.id}')">📎 ${esc(f.name)}</button>`).join('')}<label class=btnlike>＋ 추가<input type=file accept="image/*,audio/*,application/pdf" multiple hidden onchange="addFiles('${id}',this.files)"></label></div><div class="mut warn" style="margin-top:6px">환자 이름·등록번호·EMR 화면은 첨부하지 마세요.</div>`;
  h+=`<label>메모</label><textarea rows=2 onchange="setF('${id}','note',this.value)">${esc(r.note)}</textarea>`;
  if(full){
    h+=`<label>기록 정보</label><div class=mut>생성 ${fmtISO(r.createdAt)}</div>${(r.history||[]).map(x=>`<div class=mut>${fmtISO(x.at)} ${FIELD[x.field]||x.field}: ${esc(x.from)||'(없음)'} → ${esc(x.to)||'(없음)'}</div>`).join('')}`;
    h+=`<div class="row sb" style="margin-top:14px"><button onclick="go('list')">목록으로</button><button class=warn onclick="delRec('${id}')">삭제</button></div>`;
  }else h+=`<div class="row sb" style="margin-top:14px"><button onclick="openForm('${id}')">자세히·수정 이력</button><a href="#" class=mut onclick="openNew(todayStr(),'live');return false">오늘 기록 하나 더</a></div>`;
  return h+'</div>';
}
function today(){
  const cur=S.records.find(r=>r.source==='live'&&r.actStart&&!r.actEnd)||S.records.find(r=>r.date===todayStr());
  let h=banner();
  if(cur)return h+editor(cur,false);
  h+=`<div class=card><div class=mut>${fmtDate(todayStr())} · 출근하면 근무조를 누르세요. 지금 시각 <b>${nowHM()}</b>이 출근 시각으로 기록됩니다.</div><div class=grid2 style="margin-top:12px">${['D','E','N','OFF'].map(s=>`<button class="big p" onclick="clockIn('${s}')">${SHIFT[s]}<br><small>${s==='OFF'?'휴일 출근':S.settings.shifts[s].join('–')}</small></button>`).join('')}</div>`;
  h+=`<p class=mut style="margin:14px 0 0"><a href="#" onclick="openNew(todayStr(),'live');return false">시각을 직접 입력</a> · <a href="#" onclick="openNew('','restored');return false">지난 날짜 복원 입력</a></p></div>`;
  return h;
}
function list(){
  const recs=[...S.records].sort((a,b)=>b.date.localeCompare(a.date)||b.createdAt.localeCompare(a.createdAt));
  let h=`<div class=row style="margin-bottom:4px"><button class=p onclick="openNew('','restored')">지난 날짜 복원 입력</button><button onclick="openNew(todayStr(),'live')">오늘 직접 입력</button></div>`;
  if(!recs.length)return h+`<div class="card mut" style="margin-top:12px">기록이 없습니다.</div>`;
  let ym='';
  for(const r of recs){
    const m=r.date.slice(0,7);if(m!==ym){ym=m;h+=`<h3>${ymLabel(ym)}</h3>`;}
    const z=calc(r);
    h+=`<div class=item onclick="openForm('${r.id}')"><div class="row sb"><b>${fmtDate(r.date)} ${r.shift}</b><span>${z.ok?'<b>+'+fmtMin(z.ot)+'</b>':'<span class=warn>미완성</span>'}</span></div><div class=mut>${r.actStart||'--:--'}–${r.actEnd||'--:--'}${r.shift!=='OFF'?` (정규 ${r.schedStart}–${r.schedEnd})`:''} · ${esc(r.reason)||'사유 없음'} · 📎${(r.files||[]).length}${r.source==='restored'?' · <span class="badge org">복원</span>':''}${r.history?.length?` · 수정 ${r.history.length}회`:''}</div></div>`;
  }
  return h;
}
function month(){
  const ms=monthly(),w=S.settings.wage;
  let h=`<div class=row style="margin-bottom:12px"><button onclick="exportCSV()">전체 CSV</button><button onclick="printReport()">전체 인쇄·PDF</button><button onclick="shareReport()">전체 보고서 공유</button></div>`;
  if(!w)h+=`<div class="card warn">설정에서 통상시급을 입력하면 금액 추정이 표시됩니다.</div>`;
  if(!ms.length)h+='<div class="card mut">기록이 없습니다.</div>';
  for(const m of ms){
    const e=monthEst(m),ex=expiry(m.ym),days=Math.ceil((ex-Date.now())/864e5);
    const badge=days<0?'<span class="badge red">시효 만료</span>':days<=90?`<span class="badge org">D-${days} 임박</span>`:`<span class=badge>D-${days}</span>`;
    h+=`<div class=card><h3 style="margin:0 0 8px">${ymLabel(m.ym)} <small class=mut>${m.recs.length}건 (당일 ${m.live} · 복원 ${m.rest})</small></h3>
<div class=kv><span>초과 합계</span><b>${fmtMin(m.ot)}</b></div>
<div class=kv><span>야간(22~06시) 겹침</span><b>${fmtMin(m.night)}</b></div>
<div class=kv><span>법정 수당 추정</span><b>${w?wonF(e.est):'-'}</b></div>
<label>급여명세서의 시간외수당(원)</label><input type=number inputmode=numeric placeholder="그 달 실제로 받은 금액" value="${S.pay[m.ym]??''}" onchange="setPay('${m.ym}',this.value)">
<div class=kv style="margin-top:6px"><span>미지급 추정</span><b class="${e.unpaid>0?'warn':''}">${w?(e.unpaid>0?wonF(e.unpaid):'없음 (받은 금액 ≥ 추정액)'):'-'}</b></div>
<div class=kv><span>시효 만료 <span class=mut>(급여일 ${payDate(m.ym).toLocaleDateString('ko-KR')} + 3년)</span></span><span><b>${ex.toLocaleDateString('ko-KR')}</b> ${badge}</span></div>
<div class=row style="margin-top:10px"><button onclick="exportCSV('${m.ym}')">CSV</button><button onclick="printReport('${m.ym}')">인쇄·PDF</button><button onclick="shareReport('${m.ym}')">보고서 공유</button></div></div>`;
  }
  return h;
}
function settings(){
  const s=S.settings;
  return banner()+`<div class=card><h3 style="margin-top:0">계산</h3>
<label>통상시급(원) <span class=mut>— 급여명세서 기준. 정확한 값은 노무사 확인</span></label><input type=number inputmode=numeric value="${s.wage||''}" placeholder="예: 15000" onchange="setS('wage',+this.value||0)">
<div class=grid2><div><label>급여일 (매월)</label><input type=number inputmode=numeric min=1 max=31 value="${s.payday}" onchange="setS('payday',Math.min(31,Math.max(1,+this.value||25)))"></div><div><label>지급 기준</label><select onchange="setS('payMonth',this.value)"><option value=same ${s.payMonth==='same'?'selected':''}>당월분 당월 지급</option><option value=next ${s.payMonth==='next'?'selected':''}>당월분 익월 지급</option></select></div></div>
<div class=mut style="margin-top:8px">시효 만료일 = 그 달 급여일 + 3년. 달마다 따로 사라집니다.</div></div>
<div class=card><h3 style="margin-top:0">근무조 정규 시각</h3>${['D','E','N'].map(k=>`<div class=grid2><div><label>${SHIFT[k]} 시작</label><input type=time value="${s.shifts[k][0]}" onchange="setShift('${k}',0,this.value)"></div><div><label>종료</label><input type=time value="${s.shifts[k][1]}" onchange="setShift('${k}',1,this.value)"></div></div>`).join('')}
<label>사유 목록 <span class=mut>(쉼표로 구분)</span></label><input value="${esc(s.reasons.join(', '))}" onchange="setS('reasons',this.value.split(',').map(x=>x.trim()).filter(Boolean))"></div>
<div class=card><h3 style="margin-top:0">백업</h3><p class=mut style="margin-top:0">데이터는 이 폰 안에만 있습니다. 가끔 백업 파일을 iCloud Drive나 구글 드라이브에 저장하세요. 병원 PC·병원 계정에는 두지 마세요.</p>
<div class=row><button class=p onclick="exportJSON()">백업 내보내기 (JSON)</button><label class=btn>백업 복원<input type=file accept=".json,application/json" hidden onchange="importJSON(this.files[0])"></label></div>
<p class=mut style="margin-bottom:0">기록 ${S.records.length}건 · 첨부 ${S.records.reduce((n,r)=>n+(r.files||[]).length,0)}개</p></div>
<div class=card><h3 style="margin-top:0">안내</h3><ul class=mut style="padding-left:18px;margin:0"><li>금액은 추정치입니다. 최종 계산은 노무사가 합니다.</li><li>법정 수당 추정 = 초과시간 × 통상시급 × 1.5 + 야간(22~06시) 겹침 × 통상시급 × 0.5. 30분 미만도 분 단위로 셉니다.</li><li>기록을 고치면 원래 값과 수정 시각이 남습니다. 지난 날짜를 나중에 넣은 기록은 '사후 복원'으로 구분됩니다.</li><li>환자 이름·등록번호·EMR 화면은 입력·첨부하지 마세요 (의료법·개인정보보호법).</li></ul></div>`;
}
function form(){const r=rec(formId);if(!r){view='list';return list();}return editor(r,true);}

navigator.storage?.persist?.();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
render();
</script>
