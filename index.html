<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1f6f8b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="근무기록">

<style>
:root{--bg:#f5f7f9;--card:#fff;--fg:#1b2430;--mut:#66727f;--acc:#1f6f8b;--acc2:#e8f1f5;--warn:#c0392b;--bd:#dde3e8}
@media(prefers-color-scheme:dark){:root{--bg:#121619;--card:#1c2228;--fg:#e8edf1;--mut:#9aa5b0;--acc:#5fb3cf;--acc2:#1f3540;--bd:#2d3741}}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,system-ui,"Apple SD Gothic Neo",sans-serif;background:var(--bg);color:var(--fg);padding-bottom:calc(70px + env(safe-area-inset-bottom));-webkit-text-size-adjust:100%;line-height:1.45}
header{padding:calc(12px + env(safe-area-inset-top)) 16px 8px;font-weight:700;font-size:18px}
main{padding:0 16px}
h2{font-size:20px;margin:6px 0 10px}
h3{margin:14px 0 8px;font-size:16px}
.card h3:first-child{margin-top:0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;margin-bottom:12px}
button,.btn{font:inherit;border:1px solid var(--bd);background:var(--card);color:var(--fg);border-radius:10px;padding:10px 14px;cursor:pointer;display:inline-block;margin:0}
button.p,.btn.p{background:var(--acc);color:#fff;border-color:var(--acc)}
button.warn{color:var(--warn)}
button:disabled{opacity:.4}
.big{font-size:20px;padding:18px 0;width:100%;font-weight:700;line-height:1.3}
.big small{font-weight:400;font-size:13px;opacity:.85}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 12px;border-radius:20px}
.chip.on{background:var(--acc);color:#fff;border-color:var(--acc)}
input,select,textarea{font:inherit;width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--fg);min-height:44px}
label{display:block;font-size:13px;color:var(--mut);margin:10px 0 4px}
label.btn,label.btnlike{display:inline-flex;margin:0;color:var(--fg);font-size:inherit;align-items:center;justify-content:center}
label.btn.p{color:#fff}
.btnlike{width:72px;height:72px;border:1px dashed var(--bd);border-radius:8px;color:var(--mut)!important;font-size:13px!important}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;border-radius:0;padding:14px 0;color:var(--mut);background:none;font-size:14px}
nav button.on{color:var(--acc);font-weight:700}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sb{justify-content:space-between}
.mut{color:var(--mut);font-size:13px}
.warn{color:var(--warn)}
.kv{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-bottom:1px solid var(--bd)}
.kv:last-of-type{border-bottom:0}
.badge{font-size:12px;padding:2px 8px;border-radius:10px;background:var(--acc2);white-space:nowrap}
.badge.red{background:var(--warn);color:#fff}
.badge.org{background:#e67e22;color:#fff}
.badge.auto{background:#2e86de;color:#fff}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.thumbs img{width:72px;height:72px;object-fit:cover;border-radius:8px;background:var(--bd)}
.item{padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}
a{color:var(--acc)}
ul,ol{padding-left:20px;margin:6px 0}
li{margin:6px 0}
code{background:var(--acc2);padding:1px 5px;border-radius:4px;font-size:13px}
.ex{background:var(--acc2);border-radius:8px;padding:10px;margin-top:10px}
.honest{border:1px solid #e67e22;background:#e67e2218;border-radius:8px;padding:8px 12px;margin-bottom:10px;font-size:14px}.honest details{margin-top:2px}.honest summary{font-size:13px;padding:2px 0}.honest ol{font-size:13px;color:var(--mut)}
.src{font-size:12px;color:var(--mut);margin-top:10px}
details{margin-top:12px}summary{cursor:pointer;color:var(--acc);font-size:14px;padding:6px 0}
.chk{display:flex;align-items:center;gap:8px;color:var(--fg);font-size:inherit;margin-top:12px}.chk input{width:auto;min-height:0;transform:scale(1.3)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .cell{padding:4px 0;border-radius:8px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:1px;min-height:50px;font-size:14px}
.cal .cell small{font-weight:400;color:var(--mut);font-size:11px}
.cell.D{background:#f1c40f40}.cell.E{background:#e67e2240}.cell.N{background:#8e44ad40}.cell.O{background:var(--bd)}
dialog{border:0;border-radius:12px;padding:16px;max-width:92vw;background:var(--card);color:var(--fg)}
dialog::backdrop{background:rgba(0,0,0,.6)}
#print{display:none}
@media print{body>*{display:none!important}#print{display:block!important}body{padding:0;background:#fff;color:#000;font-size:11px}#print table{border-collapse:collapse;width:100%;margin-bottom:14px}#print th,#print td{border:1px solid #999;padding:3px 5px;text-align:left;vertical-align:top}}
</style>
</head>
<body>
<header>근무시간 기록</header>
<main id="view"></main>
<nav>
<button data-v="home" onclick="go('home')">홈</button>
<button data-v="list" onclick="go('list')">목록</button>
<button data-v="roster" onclick="go('roster')">근무표</button>
<button data-v="month" onclick="go('month')">월별</button>
<button data-v="settings" onclick="go('settings')">설정</button>
</nav>
<dialog id="dlg"></dialog>
<div id="print"></div>
<script>
// ---------- 데이터 ----------
const KEY='otlog.v1';
const DEF={settings:{wage:0,payday:25,payMonth:'same',shifts:{D:['07:00','15:00'],E:['15:00','23:00'],N:['23:00','07:00']},reasons:['인수인계','인증평가 준비','교육·회의','업무 마무리','기타'],autoReason:'인수인계',autoOffset:10,tourDone:false},records:[],pay:{},roster:{},imported:{},sealed:{}};
const FIELD={date:'날짜',shift:'근무조',schedStart:'정규시작',schedEnd:'정규종료',actStart:'실제출근',actEnd:'실제퇴근',reason:'사유',basis:'지시근거',note:'메모',files:'첨부',handoverStart:'인계시작',otClaim:'시간외신청',otClaimNote:'신청메모',noBreak:'휴게미사용',peers:'동료',hospLogs:'병원기록',changeMin:'환복분'};
const SHIFT={D:'데이(D)',E:'이브닝(E)',N:'나이트(N)',OFF:'휴일(OFF)'};
const SRC={live:'당일 기록',restored:'사후 복원',auto:'자동 기록'};
const SRCB={live:'badge',restored:'badge org',auto:'badge auto'};
const DOW='일월화수목금토';
const OTC={'':'선택',none:'신청 안 함',applied:'신청함',rejected:'신청했으나 반려',blocked:'신청 못 함(분위기·지시)'};
const HOSP=['출입카드','EMR 로그인','간호기록 작성시각','근무표','기타'];
let S=load(), view=S.settings.tourDone?'home':'tour', formId=null, tourPage=0;

function load(){try{const j=JSON.parse(localStorage.getItem(KEY));if(j)return{settings:{...DEF.settings,...j.settings},records:j.records||[],pay:j.pay||{},roster:j.roster||{},imported:j.imported||{},sealed:j.sealed||{}};}catch(e){}return JSON.parse(JSON.stringify(DEF));}
function save(){localStorage.setItem(KEY,JSON.stringify(S));}

// 첨부 파일은 IndexedDB (localStorage는 5MB 한계)
const idb=new Promise((res,rej)=>{const q=indexedDB.open('otlog',1);q.onupgradeneeded=()=>q.result.createObjectStore('files',{keyPath:'id'});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
async function fx(mode,fn){const db=await idb;return new Promise((res,rej)=>{const t=db.transaction('files',mode);const r=fn(t.objectStore('files'));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);});}
const files={put:f=>fx('readwrite',s=>s.put(f)),get:id=>fx('readonly',s=>s.get(id)),del:id=>fx('readwrite',s=>s.delete(id)),all:()=>fx('readonly',s=>s.getAll()),clear:()=>fx('readwrite',s=>s.clear())};

// ---------- 유틸 ----------
const pad=n=>String(n).padStart(2,'0');
const todayStr=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};
const toMin=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m;};
const fmtMin=m=>{m=Math.round(m);const h=Math.floor(m/60),r=m%60;return (h?h+'시간':'')+(r||!h?(h?' ':'')+r+'분':'');};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rec=id=>S.records.find(r=>r.id===id);
const parts=d=>d.split('-').map(Number);
const dow=d=>{const [y,m,dd]=parts(d);return DOW[new Date(y,m-1,dd).getDay()];};
const fmtDate=d=>{const [,m,dd]=parts(d);return `${m}/${dd}(${dow(d)})`;};
const fmtISO=iso=>{const d=new Date(iso);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;};
const fmtTS=iso=>fmtISO(iso).slice(5);
const wonF=n=>Math.round(n).toLocaleString('ko-KR')+'원';
const ymLabel=ym=>ym.replace('-','년 ')+'월';
const toDate=(d,t)=>{const [y,m,dd]=parts(d),[h,mi]=t.split(':').map(Number);return new Date(y,m-1,dd,h,mi);};
const cyc=(a,b)=>{const d=Math.abs(a-b);return Math.min(d,1440-d);};
const addMin=(t,d)=>{const m=((toMin(t)+d)%1440+1440)%1440;return pad(Math.floor(m/60))+':'+pad(m%60);};
// 정직 기록 원칙 (20B)
const HONEST_SHORT='실제보다 늘려 적지 마세요. 애매하면 짧게 적는 쪽이 이깁니다.';
const HONEST_LINE='이 기록은 실제보다 늘리지 않는 원칙으로 작성했습니다. 위치 자동 시각은 이동 시간을 빼고 계산했습니다.';
const honestBox=()=>`<div class=honest><b>${HONEST_SHORT}</b><details><summary>자세히 보기</summary><ol>
<li><b>병원도 기록을 갖고 있습니다.</b> 출입카드, EMR 로그인·로그아웃, 간호기록 작성 시각. 청구하면 노동청이나 법원이 병원에 이 기록을 내라고 할 수 있고, 내 기록과 나란히 놓고 비교합니다.</li>
<li><b>증명은 내가 해야 합니다.</b> 병원은 내가 몇 시에 나갔는지 증명하지 않아도 됩니다. "이 기록은 믿기 어렵다"는 것만 보여주면 됩니다.</li>
<li><b>하나가 어긋나면 전부 의심받습니다.</b> 병원 기록보다 내게 유리하게 적은 날이 하나라도 드러나면, 그날만이 아니라 3년 치 전체를 믿지 않을 수 있습니다.</li>
<li>일부러 꾸민 기록으로 돈을 청구하면 형사 문제(소송사기)가 될 수 있습니다.</li>
<li><b>그래서 이렇게 적습니다.</b> 모르면 빈칸. 기억이 애매하면 짧은 쪽. 추정한 값은 "추정" 표시. 고친 기록은 수정 이력이 남는데, 정직하게 고친 이력은 오히려 믿음을 줍니다.</li>
<li>위치 자동 시각에는 병원까지 걷는 시간이 들어 있어 실제 일한 시간보다 깁니다. 그래서 앱은 설정한 이동 시간만큼 빼고 계산합니다.</li></ol></details></div>`;
// 봉인 코드: 기록을 생성 순으로 SHA-256 연쇄 해시. 나에게 보낸 메일의 서버 시각이 그 이전 기록 전체를 고정한다.
async function sha(t){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
const canon=r=>JSON.stringify({id:r.id,date:r.date,shift:r.shift,schedStart:r.schedStart,schedEnd:r.schedEnd,actStart:r.actStart,actEnd:r.actEnd,locStart:r.locStart,locEnd:r.locEnd,offsetMin:r.offsetMin,changeMin:r.changeMin,reason:r.reason,basis:r.basis,note:r.note,source:r.source,createdAt:r.createdAt,stampStart:r.stampStart,stampEnd:r.stampEnd,srvStart:r.srvStart,srvEnd:r.srvEnd,history:r.history,rawLines:r.rawLines,files:(r.files||[]).map(f=>f.name),handoverStart:r.handoverStart,otClaim:r.otClaim,otClaimNote:r.otClaimNote,noBreak:r.noBreak,peers:r.peers,hospLogs:r.hospLogs});
async function seal(upTo){let h='';const rs=[...S.records].filter(r=>!upTo||r.date<=upTo).sort((a,b)=>a.createdAt.localeCompare(b.createdAt)||a.id.localeCompare(b.id));for(const r of rs)h=await sha(h+'|'+canon(r));return h?h.slice(0,12):'-';}
// 서버 시각: 폰 시계 조작 의심을 막기 위해 저장 때 HEAD 응답의 Date 헤더를 함께 남긴다 (오프라인이면 없음)
async function serverNow(){try{const r=await fetch(location.pathname,{method:'HEAD',cache:'no-store'});const d=r.headers.get('Date');return d?new Date(d).toISOString():'';}catch(e){return'';}}
const clockDiff=(local,srv)=>srv?Math.round((new Date(local)-new Date(srv))/1000):0;

// ---------- 계산 ----------
// 초과 = 정규 시작 전(조기) + 정규 종료 후(연장). 휴일(OFF)은 전체가 초과. 야간 = 초과 중 22~06시 겹침.
function calc(r){
  const z={early:0,late:0,ot:0,night:0,ok:false};
  let a0=toMin(r.actStart),a1=toMin(r.actEnd);if(a0==null||a1==null)return z;
  const segs=[];
  if(r.shift==='OFF'){if(a1<=a0)a1+=1440;segs.push([a0,a1]);z.late=a1-a0;}
  else{
    let s0=toMin(r.schedStart),s1=toMin(r.schedEnd);if(s0==null||s1==null)return z;
    if(s1<=s0)s1+=1440;
    if(s0-a0>720)a0+=1440;else if(a0-s0>720)a0-=1440;
    if(a1<=a0)a1+=1440;
    if(a0<s0){const e=Math.min(s0,a1);segs.push([a0,e]);z.early=e-a0;}
    if(a1>s1){const b=Math.max(s1,a0);segs.push([b,a1]);z.late=a1-b;}
  }
  z.ot=z.early+z.late;z.ok=true;
  for(const [x,y] of segs)for(const [p,q] of [[-120,360],[1320,1800],[2760,3240]])z.night+=Math.max(0,Math.min(y,q)-Math.max(x,p));
  return z;
}
const won=(z,w)=>Math.round(w*(z.ot/60*1.5+z.night/60*0.5));
function payDate(ym){let [y,m]=parts(ym);if(S.settings.payMonth==='next'){m++;if(m>12){m=1;y++;}}const last=new Date(y,m,0).getDate();return new Date(y,m-1,Math.min(S.settings.payday,last));}
function expiry(ym){const d=payDate(ym);d.setFullYear(d.getFullYear()+3);return d;}
function monthly(){const g={};for(const r of S.records){const ym=r.date.slice(0,7);const o=g[ym]=g[ym]||{ym,recs:[],ot:0,night:0,live:0,rest:0,auto:0,noBreak:0};const z=calc(r);o.recs.push(r);o.ot+=z.ot;o.night+=z.night;o.noBreak+=r.noBreak?1:0;o[r.source==='restored'?'rest':r.source==='auto'?'auto':'live']++;}return Object.values(g).sort((a,b)=>b.ym.localeCompare(a.ym));}
function monthEst(m){const w=S.settings.wage;const est=w?Math.round(w*(m.ot/60*1.5+m.night/60*0.5)):0;const paid=+(S.pay[m.ym]||0);return{est,paid,unpaid:est-paid};}
const rows=ym=>[...S.records].filter(r=>!ym||r.date.startsWith(ym)).sort((a,b)=>a.date.localeCompare(b.date)||a.createdAt.localeCompare(b.createdAt));
// 근무표: 월별 문자열, 1일부터 D/E/N/O(OFF)/공백(모름)
const rosterShift=d=>({D:'D',E:'E',N:'N',O:'OFF'}[(S.roster[d.slice(0,7)]||'')[+d.slice(8)-1]||'']||null);
function inferShift(t){const m=toMin(t);let best='D',bd=1e9;for(const k of ['D','E','N']){const d=cyc(m,toMin(S.settings.shifts[k][0]));if(d<bd){bd=d;best=k;}}return best;}
function needsCheck(r){if(r.source==='auto'){if(!r.actStart||!r.actEnd)return true;if(r.shift!=='OFF'&&r.schedStart&&cyc(toMin(r.actStart),toMin(r.schedStart))>180)return true;}return r.source==='live'&&!!r.actStart&&!r.actEnd&&r.date!==todayStr();}
function checkText(r){if(!r.actStart)return '출근 시각 없음';if(!r.actEnd)return '퇴근 시각 없음';return '근무표 시각과 3시간 이상 차이';}

// ---------- 기록 조작 (덮어쓰기 금지: 바꾸면 이력에 남김) ----------
function logChange(r,field,from,to){if((from||'')===(to||''))return;(r.history=r.history||[]).push({at:new Date().toISOString(),field,from:from||'',to:to||''});}
function newRecord(date,shift,source){const sh=S.settings.shifts[shift]||['',''];const r={id:uid(),date,shift,schedStart:shift==='OFF'?'':sh[0],schedEnd:shift==='OFF'?'':sh[1],actStart:'',actEnd:'',reason:'',basis:'',note:'',files:[],source,createdAt:new Date().toISOString(),history:[]};S.records.push(r);return r;}
async function clockIn(shift){const r=newRecord(todayStr(),shift,'live');r.actStart=nowHM();r.stampStart=new Date().toISOString();save();render();r.srvStart=await serverNow();save();render();}
async function clockOut(id){const r=rec(id);r.actEnd=nowHM();r.stampEnd=new Date().toISOString();save();render();r.srvEnd=await serverNow();save();render();}
function setF(id,f,v){
  const r=rec(id);if((r[f]||'')===(v||''))return;
  const draft=!r.actStart&&!r.actEnd; // 시각을 아직 안 넣은 기록은 작성 중 → 수정 이력 안 남김
  if(r[f]&&!draft)logChange(r,f,r[f],v);
  r[f]=v;
  if(f==='shift'){const sh=S.settings.shifts[v]||['',''];const ns=v==='OFF'?'':sh[0],ne=v==='OFF'?'':sh[1];if(!draft){if(r.schedStart)logChange(r,'schedStart',r.schedStart,ns);if(r.schedEnd)logChange(r,'schedEnd',r.schedEnd,ne);}r.schedStart=ns;r.schedEnd=ne;}
  save();patch(r);
}
function setReason(id,i){const r=rec(id);const v=S.settings.reasons[i];setF(id,'reason',r.reason===v?'':v);render();}
function toggleHosp(id,x){const r=rec(id);const a=(r.hospLogs||'').split(',').filter(Boolean);const i=a.indexOf(x);i<0?a.push(x):a.splice(i,1);setF(id,'hospLogs',a.join(','));render();}
const hv=(f,v)=>f==='noBreak'?(v?'예':'아니오'):f==='otClaim'?(OTC[v]||v||''):(v||'');

// ---------- 자동 기록 가져오기 (단축어가 쓴 텍스트 파일: "2026-10-27 06:31 in") ----------
function parseLog(text){const out=[];for(const line of text.split(/\r?\n/)){const m=line.match(/(\d{4})[-./](\d{1,2})[-./](\d{1,2})[^\d]*(\d{1,2}):(\d{2})[^a-z가-힣]*(in|out|출근|퇴근|도착|출발)/i);if(!m)continue;const date=`${m[1]}-${pad(+m[2])}-${pad(+m[3])}`,time=`${pad(+m[4])}:${m[5]}`,k=/in|출근|도착/i.test(m[6])?'in':'out';out.push({date,time,k,key:`${date} ${time} ${k}`,raw:line.trim()});}return out.sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));}
// 첫 도착부터 14시간 안의 도착은 같은 근무(점심 외출 등), 20시간 안의 마지막 출발이 퇴근
function importEvents(ev){
  const res={added:0,updated:0,dup:0,orphan:0};const sessions=[];let cur=null;
  for(const e of ev){const t=toDate(e.date,e.time);
    if(e.k==='in'){if(cur&&t-cur.t0<=14*36e5){cur.keys.push(e.key);cur.raws.push(e.raw);continue;}cur={date:e.date,start:e.time,end:'',t0:t,keys:[e.key],raws:[e.raw]};sessions.push(cur);}
    else if(cur&&t>cur.t0&&t-cur.t0<=20*36e5){cur.end=e.time;cur.keys.push(e.key);cur.raws.push(e.raw);}
    else{let d=e.date;if(toMin(e.time)<720){const x=toDate(d,'00:00');x.setDate(x.getDate()-1);d=todayStr(x);}sessions.push({date:d,start:'',end:e.time,t0:t,keys:[e.key],raws:[e.raw],orphan:true});cur=null;}
  }
  for(const s of sessions){
    const ex=S.records.find(r=>(r.autoKeys||[]).some(k=>s.keys.includes(k)));
    if(ex){let ch=false;const off=ex.offsetMin||0;if(!ex.actEnd&&s.end){ex.locEnd=s.end;ex.actEnd=addMin(s.end,-off);ch=true;}if(!ex.actStart&&s.start){ex.locStart=s.start;ex.actStart=addMin(s.start,off);ch=true;}s.keys.forEach((k,i)=>{if(!ex.autoKeys.includes(k)){ex.autoKeys.push(k);(ex.rawLines=ex.rawLines||[]).push(s.raws[i]);}S.imported[k]=1;});if(ch){res.updated++;if(S.settings.autoReason&&!ex.reason&&calc(ex).ot>0)ex.reason=S.settings.autoReason;}else res.dup++;continue;}
    if(s.keys.every(k=>S.imported[k])){res.dup++;continue;}
    for(const k of s.keys)S.imported[k]=1;
    // 위치 시각 → 업무 시각: 도착 + 이동 분, 출발 − 이동 분 (실제보다 길게 잡히지 않게). 너무 짧은 근무는 보정 안 함
    let off=S.settings.autoOffset||0;if(s.start&&s.end&&((toMin(s.end)-toMin(s.start)+1440)%1440)<=2*off)off=0;
    const r=newRecord(s.date,rosterShift(s.date)||inferShift(s.start||s.end),'auto');r.locStart=s.start;r.locEnd=s.end;r.offsetMin=off;r.rawLines=s.raws;r.actStart=s.start?addMin(s.start,off):'';r.actEnd=s.end?addMin(s.end,-off):'';r.autoKeys=s.keys;
    if(S.settings.autoReason&&calc(r).ot>0)r.reason=S.settings.autoReason;
    s.orphan?res.orphan++:res.added++;
  }
  return res;
}

const readDU=f=>new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(f);});
async function shrink(f){const url=URL.createObjectURL(f);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return c.toDataURL('image/jpeg',.85);}
async function addFiles(id,fl){
  const r=rec(id);
  for(const f of fl){
    let data,type=f.type||'application/octet-stream';
    try{if(type.startsWith('image/')){data=await shrink(f);type='image/jpeg';}else{if(f.size>5e6){alert(f.name+': 5MB를 넘어 첨부할 수 없습니다');continue;}data=await readDU(f);}}
    catch(e){alert(f.name+': 읽을 수 없는 파일');continue;}
    const m={id:uid(),name:f.name,type,size:data.length};
    await files.put({...m,recordId:id,data});(r.files=r.files||[]).push(m);logChange(r,'files','','＋'+f.name);
  }
  save();render();
}

async function shareOrDownload(blob,name){
  const f=new File([blob],name,{type:blob.type});
  if(navigator.canShare&&navigator.canShare({files:[f]})){try{await navigator.share({files:[f],title:name});return;}catch(e){if(e.name==='AbortError')return;}}
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},3000);
}

let rosterYM=todayStr().slice(0,7);
function roster(){

// 캡처 인식: Tesseract.js(브라우저 안에서 OCR). 이름이 있으면 그 줄만, 없으면 읽은 순서대로 D/E/N/OFF를 1일부터 채운다.
const loadScript=src=>new Promise((res,rej)=>{const t=document.createElement('script');t.src=src;t.onload=res;t.onerror=()=>rej(new Error('스크립트를 내려받지 못했습니다 (인터넷 필요)'));document.head.appendChild(t);});
async function upscale(file){const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});const k=img.width<2000?2:1;const c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);return c;}
const tokensToSeq=t=>t.toUpperCase().replace(/OFF|휴|연|\//g,'O').replace(/[^DENO0]/g,'').replace(/0/g,'O');
async function ocrRoster(file){
  if(!file)return;const st=document.getElementById('ocrStatus');const say=t=>{if(st)st.textContent=t;};
  try{
    say('글자 인식 준비 중…');
    if(!window.Tesseract)await loadScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
    const worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(m.status==='recognizing text')say(`인식 중 ${Math.round(m.progress*100)}%`);else if(m.status.includes('loading'))say('인식 데이터 내려받는 중…');}});
    const {data}=await worker.recognize(await upscale(file));await worker.terminate();say('');
    const lines=(data.lines||[]).map(l=>tokensToSeq(l.text)).filter(q=>q.length>=3);
    if(!lines.length)return say('D/E/N/OFF 글자를 찾지 못했습니다. 더 크게 잘라서 다시 올려 보세요.');
    if(lines.length===1)return applyOcr(lines[0]);
    dlg.innerHTML=`<b>본인 줄을 고르세요</b><div class=mut style="margin:4px 0 10px">위에서부터 읽힌 순서입니다. 1일부터의 근무가 맞는 줄을 누르세요.</div>${lines.map((q,i)=>`<button style="display:block;width:100%;text-align:left;margin-bottom:6px;font-family:monospace" onclick="dlg.close();applyOcr('${q}')">${i+1}. ${q.slice(0,31)}</button>`).join('')}<button onclick="dlg.close()">취소</button>`;dlg.showModal();
  }catch(e){say('인식 실패: '+(e.message||e));}
}
function applyOcr(q){S.roster[rosterYM]=q.slice(0,31);save();render();setTimeout(()=>alert(`${Math.min(31,q.length)}일분을 넣었습니다: ${q.slice(0,31)}\n달력에서 틀린 날을 눌러 고치세요.`),50);}
function rosterNav(d){let [y,m]=parts(rosterYM);m+=d;if(m<1){m=12;y--;}if(m>12){m=1;y++;}rosterYM=`${y}-${pad(m)}`;render();}
function rosterTap(i){const s=(S.roster[rosterYM]||'').padEnd(31,' ').split('');const seq=['D','E','N','O',' '];s[i]=seq[(seq.indexOf(s[i])+1)%seq.length];S.roster[rosterYM]=s.join('').trimEnd();save();render();}
function rosterSet(v){S.roster[rosterYM]=v.toUpperCase().replace(/OFF/g,'O').replace(/[^DENO ]/g,' ').slice(0,31).trimEnd();save();render();}

<p class=mut>자동화에서 메일이 확인 없이 나가는지 처음 하루 확인하세요. 안 되면 앱의 '봉인 보내기'를 주 1회 눌러도 같은 효과입니다.</p>
<p class=mut style="margin:0">세부사항(ⓘ)에서 <b>"Apple Watch에 표시"</b>를 켜면 워치의 단축어 앱에서도 탭 한 번으로 기록됩니다.</p></div>
<div class=card><h3>3. 자동화 켜기 (도착·출발)</h3><ol>
<li>단축어 앱 › <b>자동화</b> 탭 › ＋ › <b>도착</b></li>
<li>위치: 병원 주소 검색 → 반경은 가장 작게 · 시간: 언제든지 · <b>즉시 실행</b>(묻지 않음)</li>
<li>다음 › <b>단축어 실행</b> › 출근 기록</li>
<li>같은 방법으로 <b>출발</b> 자동화 → 퇴근 기록</li></ol>
<p class=mut style="margin:0">처음 며칠은 파일 앱에서 줄이 잘 쌓이는지 확인하세요. 도착 시각은 병원 반경에 들어온 시각이라 병동 도착보다 몇 분 빠를 수 있고, 위치 감지가 몇 분 늦을 수도 있습니다. 앱은 이 기록을 '자동 기록'으로 구분하고 원본 줄을 함께 보관합니다.</p></div>
<div class=card><h3>4. 근무 시작 알림 + '예' 버튼</h3><p class=mut style="margin-top:0">기숙사·병원 근처에 살아 위치가 안 맞는 분을 위한 방법입니다. 근무 시작 전에 묻고 '예'를 누르면 바로 기록됩니다.</p><ol>
<li>자동화 탭 › ＋ › <b>시간</b> › 데이 근무 시작 10분 전(예: 06:50) · 매일 · <b>즉시 실행</b></li>
<li>동작 <b>"메뉴에서 선택"</b> 추가 → 프롬프트 "출근했나요?" · 항목 <b>예</b> / <b>아니오</b></li>
<li><b>예</b> 갈래 안에 <b>"단축어 실행"</b> › 출근 기록. <b>아니오</b> 갈래는 비워 둠</li>
<li>이브닝·나이트 시작 시각으로 자동화를 2개 더</li></ol>
<p class=mut style="margin:0">알림은 iPhone에 뜹니다. Apple Watch에서는 단축어 앱(또는 컴플리케이션)에서 '출근 기록'을 탭하면 됩니다.</p></div>
<div class=card><h3>5. 다른 트리거</h3><ul style="margin:0"><li><b>Wi-Fi</b>: 자동화 › Wi-Fi › 병동 Wi-Fi에 연결될 때 → 출근 기록, 연결 해제 → 퇴근 기록</li><li><b>NFC 스티커</b>: 사물함에 붙이고 자동화 › NFC → 태그 등록 → 출근 기록 (퇴근용 하나 더)</li><li><b>뒷면 탭</b>: 설정 › 손쉬운 사용 › 터치 › 뒷면 탭 › 두 번 탭 → 출근 기록</li></ul></div>
<div class=card><h3>6. 원본 보관</h3><p class=mut style="margin:0"><code>근무기록.txt</code>는 지우거나 고치지 마세요. 앱은 가져온 줄을 그대로 보관하지만 원본 파일과 메일이 함께 있어야 가장 강합니다. 도착 시각은 병원 반경 진입 시각이라 앱은 설정한 이동 시간(기본 10분)을 빼고 업무 시각을 계산하며, 보고서에는 두 시각을 모두 적습니다.</p></div>
<div class=card><h3>7. Android</h3><p class=mut style="margin:0">MacroDroid·Tasker 같은 자동화 앱으로 같은 형식의 줄을 텍스트 파일에 쓰면 이 앱에서 똑같이 가져올 수 있습니다. (실제 기기 확인 전)</p></div>
